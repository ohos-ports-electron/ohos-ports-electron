name: vscode-deviceid Electron-OH contracts
on:
  push:
    paths: ['ports/vscode-deviceid/0.1.5/**', '.github/workflows/vscode-deviceid-electron-oh-checks.yml']
  pull_request:
    paths: ['ports/vscode-deviceid/0.1.5/**', '.github/workflows/vscode-deviceid-electron-oh-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen candidate from locked public baseline
        run: bash ports/vscode-deviceid/0.1.5/build.sh --output "$RUNNER_TEMP/deviceid-bundle"
      - name: Install and exercise contract, platform aliases and tampering
        run: python3 ports/vscode-deviceid/0.1.5/electron-oh/tests/host-contract.py --bundle "$RUNNER_TEMP/deviceid-bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-deviceid-build-bundle
          path: ${{ runner.temp }}/deviceid-bundle
          include-hidden-files: true
# No publishing credentials or npm upload. Device HAP verification is separate.
