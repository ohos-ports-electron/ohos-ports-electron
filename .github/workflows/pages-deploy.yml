name: Refresh and deploy Electron OH package site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_run:
    # 发布类 workflow 在 main 上成功完成后立即刷新站点数据，新包无需等待每日定时同步
    workflows:
      - 'vscode-deviceid build and npm publish'
      - 'onnxruntime-node build and npm publish'
      - 'napi-rs-canvas build and npm publish'
      - 'systeminformation build and npm publish'
      - 'node-gyp-build build and npm publish'
      - 'vscode-textmate build and npm publish'
      - 'vscode-native-watchdog build and npm publish'
      - 'rxjs build and npm publish'
      - 'axios build and npm publish'
      - 'open build and npm publish'
      - 'node-machine-id build and npm publish'
      - 'vscode-ripgrep build and npm publish'
      - 'conf build and npm publish'
      - 'vscode-oniguruma build and npm publish'
      - 'tar build and npm publish'
      - 'fs-extra build and npm publish'
      - 'windows-foreground-love build and npm publish'
      - 'address build and npm publish'
      - 'bytenode build and npm publish'
      - 'compressing build and npm publish'
      - 'vuex-electron build and npm publish'
      - 'electron-context-menu build and npm publish'
      - 'env-paths build and npm publish'
      - 'electron-is-dev build and npm publish'
      - 'which build and npm publish'
      - 'better-sqlite3-multiple-ciphers build and npm publish'
      - '7zip-bin build and npm publish'
      - 'once build and npm publish'
      - 'prebuild-install build and npm publish'
      - 'napi-build-utils build and npm publish'
      - 'get-stream build and npm publish'
      - 'jimp build and npm publish'
      - '7zip-min build and npm publish'
    types: [completed]
  schedule:
    # 每天北京时间凌晨 2:17（UTC 18:17），实际运行时间由 GitHub 调度。
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'ohos-ports-electron/ohos-ports-electron' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test catalog metadata selection
        run: python3 -m unittest discover -s docs -p test_update_packages.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - name: Test catalog rendering and install channels
        run: node --test docs/test_app.cjs
      - name: Refresh public npm package data
        env:
          NPM_ORG: ohos-ports-electron
          NPM_REGISTRY: https://registry.npmjs.org
        run: python3 -u docs/update-packages.py --skip-readme
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
