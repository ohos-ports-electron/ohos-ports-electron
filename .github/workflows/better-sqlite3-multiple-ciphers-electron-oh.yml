name: better-sqlite3-multiple-ciphers build and npm publish

on:
  pull_request:
    paths:
      - 'ports/better-sqlite3-multiple-ciphers/**'
      - '.github/workflows/better-sqlite3-multiple-ciphers-electron-oh.yml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'ports/better-sqlite3-multiple-ciphers/**'
      - '.github/workflows/better-sqlite3-multiple-ciphers-electron-oh.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: better-sqlite3-multiple-ciphers-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  PORT: ports/better-sqlite3-multiple-ciphers/13.0.4-beta.0
  # Locked device-ABI addon + frozen candidate archive published on the evidence
  # Release; hashes locked in inputs.lock.json / release-evidence.json.
  BS3MC_NATIVE_URL: https://github.com/ohos-ports-electron/ohos-ports-electron/releases/download/better-sqlite3-multiple-ciphers-evidence-13.0.4-beta.0-electron-oh.0/better_sqlite3.node

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - name: Fetch locked device addon
        run: |
          curl -fsSL "$BS3MC_NATIVE_URL" -o "$RUNNER_TEMP/better_sqlite3.node"
          echo "$BS3MC_NATIVE_SHA  $RUNNER_TEMP/better_sqlite3.node" | sha256sum -c -
        env:
          BS3MC_NATIVE_SHA: 756001b0bbe900d13ce8bd4b3e826cd13fa852ad72dd707a69ecec8a87e14292
      - name: Build the candidate once and bind the current recipe
        run: |
          curl -fsSL "https://registry.npmjs.org/better-sqlite3-multiple-ciphers/-/better-sqlite3-multiple-ciphers-13.0.4-beta.0.tgz" -o "$RUNNER_TEMP/baseline.tgz"
          sha256sum "$RUNNER_TEMP/baseline.tgz"
          python3 "$PORT/electron-oh/tools/build.py" \
            --port "$PORT" --output "$RUNNER_TEMP/bundle" \
            --archive "$RUNNER_TEMP/baseline.tgz" \
            --device-addon "$RUNNER_TEMP/better_sqlite3.node"
          python3 "$PORT/electron-oh/tools/release.py" bind --bundle "$RUNNER_TEMP/bundle"
          python3 "$PORT/electron-oh/tools/release.py" verify --bundle "$RUNNER_TEMP/bundle"
          python3 "$PORT/electron-oh/tests/release-contract.py"
      - uses: actions/upload-artifact@v4
        with:
          name: better-sqlite3-multiple-ciphers-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 30

  compatibility:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.17.0', '24.11.1', '24.13.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: better-sqlite3-multiple-ciphers-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle
      - name: Install the frozen tgz and run the host contract
        run: python3 "$PORT/electron-oh/tools/release.py" host --bundle "$RUNNER_TEMP/bundle"

  publish:
    needs: [build, compatibility]
    if: >-
      github.repository == 'ohos-ports-electron/ohos-ports-electron' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global npm@12.2.1
      - uses: actions/download-artifact@v4
        with:
          name: better-sqlite3-multiple-ciphers-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle
      - name: Publish frozen bytes and verify latest and beta tags
        env:
          ENABLE_ELECTRON_OH_PUBLISH: '1'
          ELECTRON_OH_BUNDLE: ${{ runner.temp }}/bundle
          GITHUB_ENVIRONMENT: npm-publish
        run: bash "$PORT/publish.sh"
