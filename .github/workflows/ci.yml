name: Legacy ports build checks

on:
  push:
    branches: [main]
    paths:
      - "ports/**"
  pull_request:
    paths:
      - "ports/**"

# Inherited upstream ports are build-only in this fork. Electron releases use
# a reviewed dedicated workflow and may only target @ohos-ports-electron.
permissions:
  contents: read

jobs:
  # 检测哪些目录的文件有变化，截取出 ports/<name>/<version> 这一级
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find changed port versions
        id: set-matrix
        run: |
          BASE=${{ github.event.before }}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          fi

          export BASE
          dirs=$(python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE'], 'HEAD'], text=True).splitlines()
          dirs = { '/'.join(p.split('/')[:3]) for p in files if p.startswith('ports/') and len(p.split('/')) >= 4 and not p.startswith(('ports/vscode-deviceid/', 'ports/onnxruntime-node/', 'ports/napi-rs-canvas/')) }
          print(json.dumps(sorted(d for d in dirs if (Path(d) / 'build.sh').is_file())))
          PYCODE
          )
          echo "matrix=$dirs" >> $GITHUB_OUTPUT

  # Legacy recipes are only built; they cannot publish from this workflow.
  build-legacy:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/hqzing/dockerharmony:latest
      volumes:
        - /tmp/node24:/__e/node24:rw,rshared
    steps:
      # 预置 Node.js。这版 Node.js 仅供 actions/checkout 使用，不会对构建业务产生干扰。
      - name: Setup node for actions
        run: |
          curl -fLO https://github.com/hqzing/ohos-node/releases/download/v24.2.0/node-v24.2.0-openharmony-arm64.tar.gz
          mkdir /__e/node24/bin
          tar -zxf node-v24.2.0-openharmony-arm64.tar.gz
          cp node-v24.2.0-openharmony-arm64/bin/node /__e/node24/bin/node
          rm -rf node-v24.2.0-openharmony-arm64*

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup tools
        run: ./setup-tools.sh

      - name: Build
        run: |
          source setup-env.sh
          cd "${{ matrix.dir }}"
          ./build.sh
