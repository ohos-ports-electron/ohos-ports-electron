<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electron OH 适配包查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
.container{max-width:none;width:100%;margin:0 auto;padding:40px 24px}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:28px;color:#1a1a2e;margin-bottom:8px}
.header p{color:#666;font-size:14px}
.header a{color:#4f46e5;text-decoration:none}
.stats{display:flex;justify-content:center;gap:16px;margin-bottom:24px;flex-wrap:wrap;max-width:600px;margin-left:auto;margin-right:auto}
.stat{background:#fff;border-radius:8px;padding:16px 24px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat .num{font-size:22px;font-weight:700;color:#4f46e5}
.stat .label{font-size:11px;color:#999;margin-top:4px}
.stat.deprecated .num{color:#dc2626}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:20px;max-width:600px;margin-left:auto;margin-right:auto;flex-wrap:wrap}
.tab{padding:8px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:2px solid #e0e0e0;background:#fff;color:#555}
.tab.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
.search-box{position:relative;margin-bottom:24px;max-width:600px;margin-left:auto;margin-right:auto}
.search-box input{width:100%;padding:14px 16px 14px 44px;font-size:16px;border:2px solid #e0e0e0;border-radius:8px;outline:none;background:#fff}
.search-box input:focus{border-color:#4f46e5}
.search-box .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#999}
.result-info{margin-bottom:12px;font-size:13px;color:#888;padding:0 4px}
.table-wrap{overflow-x:auto;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
table{width:100%;min-width:960px;border-collapse:collapse;background:#fff;margin:0 auto}
th{background:#f8f9fb;padding:12px 16px;text-align:left;font-size:13px;font-weight:600;color:#555;border-bottom:1px solid #eee;position:sticky;top:0}
td{padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;vertical-align:top}
tr:hover{background:#fafbfc}
.pkg-name{font-family:monospace;font-weight:500;white-space:nowrap}
.pkg-name a{color:#4f46e5;text-decoration:none}
.pkg-name a:hover{text-decoration:underline}
.pkg-orig{font-family:monospace;font-size:13px;white-space:nowrap}
.pkg-orig a{color:#6b7280;text-decoration:none}
.pkg-orig a:hover{text-decoration:underline}
.pkg-ver{font-family:monospace;font-size:13px;white-space:nowrap}
.pkg-ver.stable{color:#059669}
.pkg-ver.beta{color:#92400e}
.pkg-ver.none{color:#ccc}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-ci{background:#dbeafe;color:#1e40af}
.badge-local{background:#f3f4f6;color:#6b7280}
.badge-deprecated{background:#fee2e2;color:#dc2626}
.badge-deprecated:hover{cursor:help}
.badge-normal{background:#d1fae5;color:#059669}
.install-cmd{font-family:monospace;font-size:11px;background:#f5f5f5;padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}
.pagination button{padding:6px 14px;border:1px solid #e0e0e0;border-radius:4px;background:#fff;cursor:pointer;font-size:14px;color:#555}
.pagination button:hover:not(:disabled){background:#4f46e5;color:#fff;border-color:#4f46e5}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination .page-info{font-size:13px;color:#888}
.footer{text-align:center;margin-top:32px;font-size:12px;color:#aaa}
.footer a{color:#4f46e5;text-decoration:none}
.install-cmd{border:1px solid #e0e0e0;color:#333;text-align:left}
.tab:focus-visible,.install-cmd:focus-visible{outline:3px solid #a5b4fc;outline-offset:3px}
@media(max-width:640px){.container{padding:24px 12px}.header h1{font-size:24px}.stat{padding:12px 16px}.tabs{gap:6px}.tab{padding:8px 12px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Electron OH 适配包查询</h1>
    <p>查询 <code>@ohos-ports-electron</code> 已发布的 npm 包与 Electron OH 版本</p>
    <p style="margin-top:12px"><a href="https://www.npmjs.com/org/ohos-ports-electron" target="_blank" rel="noopener noreferrer">npm 组织</a> · <a href="https://github.com/mzsylr/ohos-ports" target="_blank" rel="noopener noreferrer">源码仓库</a></p>
  </div>
  <div class="stats" id="stats"><div class="stat"><div class="num">-</div><div class="label">加载中</div></div></div>
  <div class="tabs">
    <button class="tab active" data-filter="all" aria-pressed="true" onclick="switchTab('all')">全部</button>
    <button class="tab" data-filter="electron-oh" aria-pressed="false" onclick="switchTab('electron-oh')">有 electron-oh 标签</button>
    <button class="tab" data-filter="deprecated" aria-pressed="false" onclick="switchTab('deprecated')">已废弃</button>
  </div>
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="search" aria-label="搜索包名或描述" placeholder="输入包名或描述搜索..." autocomplete="off">
  </div>
  <div class="result-info" id="info" role="status" aria-live="polite"></div>
  <p class="result-info">默认版本对应 latest 标签；Electron OH 版本对应 electron-oh 标签。具体兼容范围请查看包文档。</p>
  <div class="table-wrap">
  <table id="table">
    <thead><tr><th>包名</th><th>原始包名</th><th>默认版本 · latest</th><th>Electron OH · electron-oh</th><th>Beta版本</th><th>状态</th><th>安装</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>
  <div class="pagination" id="pagination" style="display:none">
    <button id="prevPage" onclick="changePage(-1)">上一页</button>
    <span class="page-info" id="pageInfo"></span>
    <button id="nextPage" onclick="changePage(1)">下一页</button>
  </div>
  <div class="footer">
    数据通过 <a href="https://registry.npmjs.org" target="_blank" rel="noopener noreferrer">npm Registry API</a> 获取 |
    <a href="https://github.com/mzsylr/ohos-ports" target="_blank" rel="noopener noreferrer">GitHub 仓库</a>
    <span id="updated"></span>
    <p style="margin-top:8px">npm 数据定时同步；新发布的包会在下次同步后展示。</p>
  </div>
</div>
<script src="app.js" defer></script>
</body>
</html>
